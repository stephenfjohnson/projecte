plugins {
    id('java')
    id('eclipse')
    id('idea')
    id('maven-publish')
    id('fabric-loom') version("${loom_version}")
}

tasks.named('wrapper', Wrapper) {
    //Define wrapper values here so as to not have to always do so when updating gradlew.properties
    gradleVersion = '8.12.1'
    distributionType = Wrapper.DistributionType.ALL
}

defaultTasks 'build'

idea {
    module {
        //Exclude directories from being managed
        for (String excludeDirName in ["run", "out", "logs", "gradle"]) {
            excludeDirs.add(new File(projectDir, excludeDirName))
        }
    }
}

sourceSets {
    api {
        //The API has no resources
        resources.srcDirs = []
    }
    main {
        resources {
            //Add the generated main module resources
            srcDirs += 'src/datagen/generated'
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
        }
        //TODO - Fabric port: the recipe viewer (JEI) and Jade integrations are not ported yet, so they are
        // held out of the build while the core mod is brought up. Nothing in the core references them - they
        // are entered only through JEI's and Jade's own plugin discovery - so excluding them changes nothing
        // else. Drop these two lines to bring each back in.
        java {
            exclude 'moze_intel/projecte/integration/recipe_viewer/**'
            exclude 'moze_intel/projecte/integration/jade/**'
        }
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
}

configurations { configContainer ->
    //Make sure all our sub source set stuff extends the proper base methods so that
    // they can see all the dependencies we have in dependencies including Minecraft itself
    extendConfigurations(implementation, apiImplementation)
    extendConfigurations(compileOnly, apiCompileOnly)
    extendConfigurations(runtimeOnly, apiRuntimeOnly)
    extendConfigurations(modImplementation, apiModImplementation)
    extendConfigurations(modCompileOnly, apiModCompileOnly)
    extendConfigurations(modRuntimeOnly, apiModRuntimeOnly)
}

static void extendConfigurations(Configuration base, Configuration... configurations) {
    for (def configuration : configurations) {
        configuration.extendsFrom(base)
    }
}

//Loom only injects Minecraft and its libraries into the main source set's classpath. Hand the api
// source set the same resolved dependencies - configurations.compileClasspath holds only artifacts,
// so this avoids pulling in main's own output (which already depends on api, and would cycle).
sourceSets.api.compileClasspath += configurations.compileClasspath

version = "${projecte_version}"
group = "moze_intel.projecte"
project.base.archivesName = "projecte"

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(java_version as int))
    }
    withSourcesJar()
}

loom {
    //The API source set is part of the mod, so Loom needs to know to remap and run it
    mods {
        projecte {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }

    accessWidenerPath = file('src/main/resources/projecte.accesswidener')

    runs {
        configureEach {
            //ProjectE's TOP integration is dev-time noise unless explicitly wanted
            property('projecte.skip_top', 'true')
        }
        client {
            client()
        }
        clientAlt {
            client()
            programArgs('--username', 'AltDev')
        }
        server {
            server()
            programArgs('--nogui')
        }
    }
}

static void exclusiveRepo(RepositoryHandler handler, String url, String... groups) {
    handler.exclusiveContent {
        it.forRepositories(handler.maven {
            setUrl(url)
        })
        it.filter { f ->
            for (def group : groups) {
                f.includeGroup(group)
            }
        }
    }
}

repositories {
    exclusiveRepo(it, 'https://maven.parchmentmc.org', 'org.parchmentmc.data')
    exclusiveRepo(it, 'https://maven.blamejared.com', 'mezz.jei')
    exclusiveRepo(it, 'https://maven.terraformersmc.com/', 'dev.emi', 'com.terraformersmc')
    exclusiveRepo(it, 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/', 'fuzs.forgeconfigapiport')
    exclusiveRepo(it, 'https://maven.ladysnake.org/releases', 'dev.onyxstudios.cardinal-components-api', 'org.ladysnake.cardinal-components-api')
    exclusiveRepo(it, 'https://www.cursemaven.com', 'curse.maven')
    mavenCentral()
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    //Official Mojang mappings keep every vanilla reference in the codebase identical to the
    // pre-port NeoForge source; parchment adds the same parameter names we had before.
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:${loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    //Supplies NeoForge's ModConfigSpec on Fabric, so the config layer needs no rewrite
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")

    //NeoForge exposed JSR305 transitively; ProjectE uses @ParametersAreNonnullByDefault from it
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    //NeoForge bundled commons-math3, which the EMC arithmetic uses for BigFraction. Fabric does not
    // provide it, so nest it inside the mod jar.
    implementation(include("org.apache.commons:commons-math3:${commons_math_version}"))
}

processResources {
    def properties = [
            'version'              : version,
            'minecraft_version'    : minecraft_version_range,
            'loader_version'       : loader_version,
            'fabric_version'       : fabric_version_range,
            'java_version'         : java_version,
    ]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(java_version as int)
    it.options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
